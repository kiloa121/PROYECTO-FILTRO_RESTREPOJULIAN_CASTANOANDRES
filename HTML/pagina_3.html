<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/pagina_3.css">
    <title>Panel de KARIO Media</title>
</head>
<body>
    <div class="container">
        <div class="form-content">
            <img src="logo.png" alt="Logo KARIO Media" class="logo"> <!-- Añade el logo correspondiente -->
            <h1>Bienvenido al panel digital de<br>KARIO Media</h1>
            <p>Por favor ingresa los siguientes datos para ingresar a la plataforma</p>
            <form>
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" required>
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
                <button type="submit" class="btn-submit">Ingresar al panel</button>
            </form>
            <p class="help-text">Tienes problemas para ingresar? Por favor contactarse con asistencia técnica lo más pronto posible.</p>
        </div>
    </div>
</body>
</html>
